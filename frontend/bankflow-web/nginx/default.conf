# Derrière Traefik, le schéma d'origine (https) doit parvenir à la Gateway
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# La Gateway reconstruit l'origine du navigateur à partir de l'hôte, du schéma et du port
map "$http_host|$forwarded_proto" $forwarded_port {
    "~:(?<port>[0-9]+)\|" $port;
    "~\|https$"           443;
    default               80;
}

# Cloudflare fournit l'adresse réelle du visiteur, utilisée par les quotas de la Gateway
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Le frontend et l'API partagent la même origine : le cookie reste en SameSite=Strict
    location /api/ {
        # Le résolveur Docker retrouve la Gateway si elle redémarre avec une autre adresse
        resolver 127.0.0.11 valid=10s;
        set $gateway http://api-gateway:8080;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Le nom de ces fichiers change à chaque build : ils peuvent rester longtemps en cache
    location ~* "-[A-Za-z0-9_-]{8}\.(?:js|css)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /media/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Repli SPA : le routeur Angular traite les autres chemins
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

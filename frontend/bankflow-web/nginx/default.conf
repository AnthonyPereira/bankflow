# Derrière Traefik, le schéma d'origine (https) doit parvenir à la Gateway
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# La Gateway reconstruit l'origine du navigateur à partir de l'hôte, du schéma et du port
map "$http_host|$forwarded_proto" $forwarded_port {
    "~:(?<port>[0-9]+)\|" $port;
    "~\|https$"           443;
    default               80;
}

# Cloudflare fournit l'adresse réelle du visiteur, utilisée par les quotas de la Gateway.
# CF-Connecting-IP n'est cru que si la connexion vient d'un réseau privé (Traefik sur le réseau
# Docker) et s'il contient une adresse IP valide : $remote_addr prend alors cette valeur. Sinon,
# $remote_addr reste l'adresse de la connexion. En local, l'en-tête est absent et rien ne change.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from fc00::/7;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css;

    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Le frontend et l'API partagent la même origine : le cookie reste en SameSite=Strict.
    # ^~ : une location regex (fichiers statiques plus bas) ne peut pas capter un chemin /api/
    location ^~ /api/ {
        # Le résolveur Docker retrouve la Gateway si elle redémarre avec une autre adresse
        resolver 127.0.0.11 valid=10s;
        # Nom propre à BankFlow, pour éviter toute collision sur un réseau Docker partagé
        set $gateway http://bankflow-api-gateway:8080;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Remplace les en-têtes du client : la Gateway ne voit que l'adresse retenue plus haut
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        # Hôte sans le port, qui passe par X-Forwarded-Port. L'en-tête Forwarded (RFC 7239) d'un
        # client est retiré : la Gateway ne lit que les en-têtes posés ici
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        # Au-delà du read-timeout de 30 s de la Gateway : c'est elle qui répond 504 en ProblemDetail
        proxy_read_timeout 35s;
        # Une seule politique HSTS : celle de Spring Security ajouterait includeSubDomains
        proxy_hide_header Strict-Transport-Security;
        include /etc/nginx/snippets/hsts.conf;
    }

    # Le nom de ces fichiers change à chaque build : ils peuvent rester longtemps en cache
    location ~* "-[A-Za-z0-9_-]{8}\.(?:js|css)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /media/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Repli SPA : le routeur Angular traite les autres chemins
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

<a class="skip-link" href="#contenu-principal" (click)="skipToContent($event)">
  Aller au contenu
</a>

<mat-toolbar class="toolbar">
  @if (isCompact()) {
    <button
      matIconButton
      type="button"
      aria-label="Ouvrir le menu"
      aria-controls="navigation-principale"
      [attr.aria-expanded]="isMenuOpen()"
      (click)="isMenuOpen.set(true)"
    >
      <mat-icon aria-hidden="true" svgIcon="menu" />
    </button>
  }
  <a class="brand" routerLink="/tableau-de-bord">
    <mat-icon aria-hidden="true" svgIcon="account_balance" />
    BankFlow
  </a>
  <span class="spacer"></span>
  <button matButton type="button" (click)="logout()">
    <mat-icon aria-hidden="true" svgIcon="logout" />
    Se déconnecter
  </button>
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav
    id="navigation-principale"
    class="nav"
    [mode]="isCompact() ? 'over' : 'side'"
    [opened]="isNavOpened()"
    [disableClose]="!isCompact()"
    (closedStart)="closeMenu()"
  >
    <mat-nav-list aria-label="Navigation principale">
      <a
        mat-list-item
        routerLink="/tableau-de-bord"
        routerLinkActive
        #dashboardLink="routerLinkActive"
        [activated]="dashboardLink.isActive"
        (click)="closeMenu()"
      >
        <mat-icon matListItemIcon aria-hidden="true" svgIcon="dashboard" />
        <span matListItemTitle>Tableau de bord</span>
      </a>
      <a
        mat-list-item
        routerLink="/comptes"
        routerLinkActive
        #accountsLink="routerLinkActive"
        [activated]="accountsLink.isActive"
        (click)="closeMenu()"
      >
        <mat-icon matListItemIcon aria-hidden="true" svgIcon="account_balance_wallet" />
        <span matListItemTitle>{{ accountsTitle() }}</span>
      </a>
      <a
        mat-list-item
        routerLink="/operations"
        routerLinkActive
        #operationsLink="routerLinkActive"
        [activated]="operationsLink.isActive"
        (click)="closeMenu()"
      >
        <mat-icon matListItemIcon aria-hidden="true" svgIcon="receipt_long" />
        <span matListItemTitle>{{ operationsTitle() }}</span>
      </a>
      <a
        mat-list-item
        routerLink="/profil"
        routerLinkActive
        #profileLink="routerLinkActive"
        [activated]="profileLink.isActive"
        (click)="closeMenu()"
      >
        <mat-icon matListItemIcon aria-hidden="true" svgIcon="person" />
        <span matListItemTitle>Mon profil</span>
      </a>
      @if (isAdmin()) {
        <a
          mat-list-item
          routerLink="/administration"
          routerLinkActive
          #adminLink="routerLinkActive"
          [activated]="adminLink.isActive"
          (click)="closeMenu()"
        >
          <mat-icon matListItemIcon aria-hidden="true" svgIcon="admin_panel_settings" />
          <span matListItemTitle>Administration</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <main #main id="contenu-principal" class="content" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>

# Production simulée : aucune valeur par défaut pour les accès à la base
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# La documentation de l'API n'est pas exposée en production simulée
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: ecs

management:
  endpoint:
    health:
      show-details: never

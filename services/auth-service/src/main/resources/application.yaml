spring:
  application:
    name: auth-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:auth_user}
    password: ${DB_PASSWORD:change-me}
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Le broker confirme l'écriture et les renvois ne créent pas de doublon
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        # Une panne de Kafka ne doit pas bloquer longtemps une inscription
        max.block.ms: 3000

bankflow:
  # Comptes de démonstration au mot de passe public, affichés sur la page de connexion
  demo:
    enabled: ${DEMO_ACCOUNTS_ENABLED:true}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  jwt:
    issuer: ${JWT_ISSUER:https://bankflow.local/auth}
    audience: bankflow-api
    access-token-ttl: PT15M
    # Clé privée RSA PKCS#8 en Base64 : obligatoire avec le profil prod-sim
    private-key: ${JWT_PRIVATE_KEY:}
    key-id: ${JWT_KEY_ID:bankflow-1}
  login:
    max-attempts: 5
    lock-duration: PT15M
  refresh:
    ttl: P7D
    reuse-grace: PT10S
    # Durée de vie absolue d'une session : au-delà, il faut se reconnecter malgré les rotations
    max-session-age: P30D
    cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    purge-cron: "0 30 3 * * *"

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        # Pas de prometheus en 0.1.0 : protégé par JWT, il ne pourrait pas être scrapé
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

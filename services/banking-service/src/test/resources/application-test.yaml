# Profil des tests automatisés
spring:
  main:
    banner-mode: "off"

logging:
  level:
    com.bankflow: INFO

bankflow:
  idempotency:
    # Purge planifiée désactivée : les tests appellent la purge eux-mêmes
    purge-cron: "-"
  kafka:
    retry:
      # Attentes raccourcies : les tests ne patientent pas 2 minutes sur un message en erreur
      initial-interval-ms: 20
      max-interval-ms: 100

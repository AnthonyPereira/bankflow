name: Déploiement

# Construit les images, puis demande leur mise en ligne au dépôt privé deploy-platform.
# Ce dépôt est public : aucun job ne doit s'exécuter sur le serveur maison.
#
# Le déploiement part seulement d'une CI verte sur un push dans main. workflow_run s'exécute avec
# les secrets : il ne doit jamais traiter un run issu d'une PR (de fork ou non), d'où le filtre sur
# l'événement, la branche et le dépôt d'origine. La version déployée est le commit testé par la CI.
# Le checkout ne prend jamais une référence venue de l'événement : il récupère main, puis vérifie que
# c'est bien le commit testé. Si main a avancé entre-temps, ce run s'arrête et le suivant déploiera.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  verifier:
    name: CI verte sur main
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      a-jour: ${{ steps.version.outputs.a-jour }}
    steps:
      - name: Version à déployer
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            version="$RUN_SHA"
          else
            # Lancement manuel : le commit de main doit lui aussi avoir une CI verte sur push
            version="$GITHUB_SHA"
            verts="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$version&event=push&branch=main&status=success" --jq '.total_count')"
            if [[ "$verts" -lt 1 ]]; then
              echo "::error::Aucune CI verte sur push pour $version"
              exit 1
            fi
          fi
          [[ "$version" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SHA invalide"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Un commit plus récent sur main aura son propre déploiement après sa CI
          tete="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [[ "$tete" == "$version" ]]; then
            echo "a-jour=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main a avancé ($tete) : déploiement laissé au run suivant"
            echo "a-jour=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: image ${{ matrix.name }}
    needs: verifier
    if: needs.verifier.outputs.a-jour == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: frontend
            context: frontend/bankflow-web
            dockerfile: frontend/bankflow-web/Dockerfile
          - name: api-gateway
            context: services/api-gateway
            dockerfile: infra/docker/spring-boot.Dockerfile
          - name: auth-service
            context: services/auth-service
            dockerfile: infra/docker/spring-boot.Dockerfile
          - name: postgres
            context: infra/postgres
            dockerfile: infra/postgres/Dockerfile
          - name: kafka-init
            context: infra/kafka
            dockerfile: infra/kafka/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Vérifier le commit récupéré
        env:
          VERSION: ${{ needs.verifier.outputs.version }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$VERSION" ]] || {
            echo "::error::main a avancé pendant le déploiement : le run suivant s'en charge"
            exit 1
          }

      - name: Nom d'image en minuscules
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ needs.verifier.outputs.version }}

  deployer:
    name: demande de mise en ligne
    needs: [verifier, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prévenir deploy-platform
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          VERSION: ${{ needs.verifier.outputs.version }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY_OWNER}/deploy-platform/dispatches" \
            -f event_type=deployer \
            -f "client_payload[app]=bankflow" \
            -f "client_payload[version]=$VERSION"

name: Déploiement

# Construit les images, puis demande leur mise en ligne au dépôt privé deploy-platform.
# Ce dépôt est public : aucun job ne doit s'exécuter sur le serveur maison.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  build:
    name: image ${{ matrix.name }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: frontend
            context: frontend/bankflow-web
            dockerfile: frontend/bankflow-web/Dockerfile
          - name: api-gateway
            context: services/api-gateway
            dockerfile: infra/docker/spring-boot.Dockerfile
          - name: auth-service
            context: services/auth-service
            dockerfile: infra/docker/spring-boot.Dockerfile
          - name: postgres
            context: infra/postgres
            dockerfile: infra/postgres/Dockerfile
          - name: kafka-init
            context: infra/kafka
            dockerfile: infra/kafka/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nom d'image en minuscules
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}

  deployer:
    name: demande de mise en ligne
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prévenir deploy-platform
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY_OWNER}/deploy-platform/dispatches" \
            -f event_type=deployer \
            -f "client_payload[app]=bankflow" \
            -f "client_payload[version]=$GITHUB_SHA"

version: 2
updates:
  - package-ecosystem: maven
    directories:
      - /services/api-gateway
      - /services/auth-service
      - /services/customer-service
      - /services/banking-service
      - /services/notification-service
      - /services/analytics-fraud-service
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
    commit-message:
      prefix: build

  - package-ecosystem: npm
    directory: /frontend/bankflow-web
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint"]
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Images de base épinglées par digest : Dependabot met à jour le tag et le digest ensemble.
  # Les versions majeures sont ignorées et se montent à la main, après lecture des notes de
  # version : depuis PostgreSQL 18, PGDATA dépend de la version majeure (/var/lib/postgresql/18),
  # une 19 démarrerait donc sur une base vide en production au lieu de migrer les données ; une
  # montée majeure de node, eclipse-temurin (JDK 27 imposé par ADR-001), apache/kafka (format des
  # métadonnées KRaft) ou nginx demande aussi une vérification manuelle.
  - package-ecosystem: docker
    directories:
      - /infra/docker
      - /infra/postgres
      - /infra/kafka
      - /frontend/bankflow-web
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build

  # Images du docker-compose.yml local, alignées sur celles de la production (même règle)
  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build

version: 2
updates:
  - package-ecosystem: maven
    directories:
      - /services/api-gateway
      - /services/auth-service
      - /services/customer-service
      - /services/banking-service
      - /services/notification-service
      - /services/analytics-fraud-service
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
    commit-message:
      prefix: build

  - package-ecosystem: npm
    directory: /frontend/bankflow-web
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint"]
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Images de base épinglées par digest : Dependabot met à jour le tag et le digest ensemble
  - package-ecosystem: docker
    directories:
      - /infra/docker
      - /infra/postgres
      - /infra/kafka
      - /frontend/bankflow-web
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build

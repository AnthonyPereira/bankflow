# Environnement local BankFlow.
#   docker compose up -d                  démarre l'infrastructure
#   docker compose --profile apps up -d   démarre aussi les services applicatifs
# Les ports ne sont publiés que sur 127.0.0.1 : rien n'est exposé au réseau local.
name: bankflow

x-spring-env: &spring-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json

x-spring-service: &spring-service
  restart: unless-stopped
  profiles: [apps]
  mem_limit: 512m
  networks:
    - bankflow
  depends_on:
    postgres:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully

services:
  postgres:
    # Même image que la production : base épinglée par digest et scripts d'init intégrés
    image: bankflow/postgres:local
    build:
      context: ./infra/postgres
    container_name: bankflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?à définir dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
      POSTGRES_DB: postgres
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?à définir dans .env}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:?à définir dans .env}
      BANKING_DB_PASSWORD: ${BANKING_DB_PASSWORD:?à définir dans .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?à définir dans .env}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?à définir dans .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # Depuis PostgreSQL 18, le volume se monte sur le dossier parent de PGDATA
      - postgres-data:/var/lib/postgresql
    networks:
      - bankflow
    healthcheck:
      # -h 127.0.0.1 : le serveur temporaire de l'initialisation n'écoute pas en TCP
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.34.0
    container_name: bankflow-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    networks:
      - bankflow
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  kafka:
    # Même digest que infra/kafka/Dockerfile : Dependabot (docker-compose) les tient à jour
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    container_name: bankflow-kafka
    restart: unless-stopped
    mem_limit: 1g
    environment:
      # Mode KRaft : un seul nœud joue les rôles de broker et de contrôleur
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - bankflow
    healthcheck:
      # Interroge réellement le broker, mais avec un tas réduit : sans cela, l'outil reprendrait
      # le KAFKA_HEAP_OPTS du broker et une seconde JVM de 512 Mo dépasserait mem_limit
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms16m -Xmx64m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    # Même image que la production : elle embarque create-topics.sh
    image: bankflow/kafka-init:local
    build:
      context: ./infra/kafka
    container_name: bankflow-kafka-init
    restart: "no"
    environment:
      BOOTSTRAP_SERVER: kafka:29092
    networks:
      - bankflow
    depends_on:
      kafka:
        condition: service_healthy

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: bankflow-kafka-ui
    restart: unless-stopped
    mem_limit: 512m
    environment:
      KAFKA_CLUSTERS_0_NAME: bankflow-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "127.0.0.1:${KAFKA_UI_HOST_PORT:-8090}:8080"
    networks:
      - bankflow
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  frontend:
    image: bankflow/frontend:local
    container_name: bankflow-frontend
    profiles: ["apps"]
    build:
      context: ./frontend/bankflow-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8088}:8080"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - bankflow

  api-gateway:
    <<: *spring-service
    image: bankflow/api-gateway:local
    container_name: bankflow-api-gateway
    build:
      context: ./services/api-gateway
      dockerfile: ../../infra/docker/spring-boot.Dockerfile
    environment:
      <<: *spring-env
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      BANKING_SERVICE_URL: http://banking-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      ANALYTICS_SERVICE_URL: http://analytics-fraud-service:8085
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      auth-service:
        condition: service_healthy

  auth-service:
    <<: *spring-service
    image: bankflow/auth-service:local
    container_name: bankflow-auth-service
    build:
      context: ./services/auth-service
      dockerfile: ../../infra/docker/spring-boot.Dockerfile
    environment:
      <<: *spring-env
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?à définir dans .env}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEMO_ACCOUNTS_ENABLED: ${DEMO_ACCOUNTS_ENABLED:-true}

  customer-service:
    <<: *spring-service
    image: bankflow/customer-service:local
    container_name: bankflow-customer-service
    build:
      context: ./services/customer-service
      dockerfile: ../../infra/docker/spring-boot.Dockerfile
    environment:
      <<: *spring-env
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/customer_db
      DB_USERNAME: customer_user
      DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:?à définir dans .env}

  banking-service:
    <<: *spring-service
    image: bankflow/banking-service:local
    container_name: bankflow-banking-service
    build:
      context: ./services/banking-service
      dockerfile: ../../infra/docker/spring-boot.Dockerfile
    environment:
      <<: *spring-env
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/banking_db
      DB_USERNAME: banking_user
      DB_PASSWORD: ${BANKING_DB_PASSWORD:?à définir dans .env}
      DEMO_ACCOUNTS_ENABLED: ${DEMO_ACCOUNTS_ENABLED:-true}

  notification-service:
    <<: *spring-service
    image: bankflow/notification-service:local
    container_name: bankflow-notification-service
    build:
      context: ./services/notification-service
      dockerfile: ../../infra/docker/spring-boot.Dockerfile
    environment:
      <<: *spring-env
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USERNAME: notification_user
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?à définir dans .env}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025

  analytics-fraud-service:
    <<: *spring-service
    image: bankflow/analytics-fraud-service:local
    container_name: bankflow-analytics-fraud-service
    build:
      context: ./services/analytics-fraud-service
      dockerfile: ../../infra/docker/spring-boot.Dockerfile
    environment:
      <<: *spring-env
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/analytics_db
      DB_USERNAME: analytics_user
      DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?à définir dans .env}

networks:
  bankflow:
    name: bankflow
    driver: bridge

volumes:
  postgres-data:
    name: bankflow-postgres-data
  mailpit-data:
    name: bankflow-mailpit-data
  kafka-data:
    name: bankflow-kafka-data

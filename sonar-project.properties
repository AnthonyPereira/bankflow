# Analyse SonarQube Cloud du mono-repo, lancée par le job « sonarqube » de la CI.
sonar.projectKey=AnthonyPereira_bankflow
sonar.organization=anthonypereira
sonar.projectName=BankFlow

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=services/*/src/test/**,frontend/bankflow-web/src/**/*.spec.ts
sonar.exclusions=services/*/src/test/**,frontend/bankflow-web/src/**/*.spec.ts,**/node_modules/**,**/target/**,**/dist/**,**/coverage/**,**/.angular/**,**/package-lock.json,**/mvnw,**/mvnw.cmd

# Java
sonar.java.source=27
sonar.java.binaries=services/*/target/classes
sonar.java.test.binaries=services/*/target/test-classes
sonar.java.libraries=services/*/target/sonar-libs/*.jar
sonar.java.test.libraries=services/*/target/sonar-libs/*.jar

# Couverture
sonar.coverage.jacoco.xmlReportPaths=services/*/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/bankflow-web/coverage/**/lcov.info
sonar.coverage.exclusions=services/*/src/main/java/**/*Application.java,frontend/bankflow-web/src/main.ts

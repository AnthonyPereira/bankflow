# Déploiement sur le serveur maison (BF-023-16).
# Le script deploy-app copie ce seul fichier sur le serveur et fournit APP_NAME, APP_HOST et
# IMAGE_PREFIX. Les secrets vivent dans ~/apps/bankflow/.env (docs/runbooks/deploiement.md).
#
# Seul le frontend rejoint le réseau de Traefik : il relaie /api vers la Gateway. La MVP 1 ne
# déploie que les services qu'elle utilise, car le serveur dispose de 8 Go de mémoire.

x-java-service: &java-service
  restart: unless-stopped
  mem_limit: 512m
  security_opt:
    - no-new-privileges:true
  networks:
    - interne

services:
  frontend:
    image: ${IMAGE_PREFIX}-frontend:latest
    restart: unless-stopped
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    networks:
      - web
      - interne
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.${APP_NAME}.rule=Host(`${APP_HOST}`)
      - traefik.http.services.${APP_NAME}.loadbalancer.server.port=8080
    depends_on:
      api-gateway:
        condition: service_healthy

  api-gateway:
    <<: *java-service
    image: ${IMAGE_PREFIX}-api-gateway:latest
    environment:
      SPRING_PROFILES_ACTIVE: prod-sim
      JAVA_TOOL_OPTIONS: -Xmx256m -XX:+ExitOnOutOfMemoryError
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
      # Le tunnel termine HTTPS avant Traefik : l'origine publique est donc déclarée ici
      CORS_ALLOWED_ORIGINS: https://${APP_HOST}
    depends_on:
      auth-service:
        condition: service_healthy

  auth-service:
    <<: *java-service
    image: ${IMAGE_PREFIX}-auth-service:latest
    environment:
      SPRING_PROFILES_ACTIVE: prod-sim
      JAVA_TOOL_OPTIONS: -Xmx256m -XX:+ExitOnOutOfMemoryError
      SERVER_PORT: 8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?à définir dans ~/apps/bankflow/.env}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?à définir dans ~/apps/bankflow/.env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?à définir dans ~/apps/bankflow/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?à définir dans ~/apps/bankflow/.env}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  postgres:
    image: ${IMAGE_PREFIX}-postgres:latest
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: bankflow_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans ~/apps/bankflow/.env}
      POSTGRES_DB: postgres
      # Toutes les bases sont créées dès le premier démarrage pour préparer les prochaines versions
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?à définir dans ~/apps/bankflow/.env}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:?à définir dans ~/apps/bankflow/.env}
      BANKING_DB_PASSWORD: ${BANKING_DB_PASSWORD:?à définir dans ~/apps/bankflow/.env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?à définir dans ~/apps/bankflow/.env}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?à définir dans ~/apps/bankflow/.env}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - interne
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bankflow_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  kafka:
    image: apache/kafka:4.4.0
    restart: unless-stopped
    mem_limit: 512m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - interne
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-init:
    image: ${IMAGE_PREFIX}-kafka-init:latest
    restart: "no"
    environment:
      BOOTSTRAP_SERVER: kafka:29092
    networks:
      - interne
    depends_on:
      kafka:
        condition: service_healthy

networks:
  web:
    external: true
  interne:

volumes:
  postgres-data:
  kafka-data:
